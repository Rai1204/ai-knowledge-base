services:
  - type: web
    name: ai-kb-llm-service
    env: python
    runtime: python-3.11.8
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 8000
